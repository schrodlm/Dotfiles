# Environment vars read by systemd --user, inherited by all processes
# started by the user session (including ones launched from sway after
# `dbus-update-activation-environment --systemd ...`).
#
# Why each:
#   MOZ_ENABLE_WAYLAND       — Firefox/Thunderbird go native Wayland
#   QT_QPA_PLATFORM=wayland;xcb  — Qt apps prefer Wayland, fall back to X
#   QT_WAYLAND_DISABLE_WINDOWDECORATION  — let sway draw decorations
#   SDL_VIDEODRIVER          — SDL games / apps go native
#   _JAVA_AWT_WM_NONREPARENTING  — fixes blank Java windows under tiling WMs
#   NIXOS_OZONE_WL           — Electron/Chromium-based apps (Discord, Obsidian,
#                              VS Code, Spotify) go native instead of XWayland

# Prepend Nix-managed binaries to PATH so apps installed via home-manager
# (spotify, discord, obsidian, etc.) are findable by sway's `exec` and by
# rofi's drun mode. Without this, sway inherits a bare PATH from the display
# manager and `exec spotify` silently fails.
PATH=${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH}

MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
SDL_VIDEODRIVER=wayland
_JAVA_AWT_WM_NONREPARENTING=1
NIXOS_OZONE_WL=1
