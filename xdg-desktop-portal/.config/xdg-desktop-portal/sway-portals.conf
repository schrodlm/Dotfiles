# Portal backend selection for Sway sessions.
# Picked up when XDG_CURRENT_DESKTOP=sway, via filename `sway-portals.conf`.
# Without this, xdg-desktop-portal-gnome (if installed) wins alphabetically
# and screen sharing breaks silently.

[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=gtk
